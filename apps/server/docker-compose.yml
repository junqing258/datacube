services:
  mysql:
    image: mysql:8.4
    container_name: datacube-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: datacube
    ports:
      - '3306:3306'
    volumes:
      - datacube-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  datacube-mysql-data:
