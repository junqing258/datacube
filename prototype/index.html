<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataCube · 产品原型</title><link rel="stylesheet" href="theme.css">
</head>
<body>
  <aside>
    <button class="brand" onclick="go(0)"><span class="logo" aria-hidden="true"></span>DataCube</button>
    <div class="space">经营分析空间</div>
    <nav id="nav" aria-label="主导航"></nav>
    <div class="asidebottom"><span class="avatar" aria-hidden="true">林</span><div><strong>林晓</strong><small>业务管理员</small></div></div>
  </aside>
  <header><span>经营分析空间 / <b id="crumb">首页</b></span><span class="environment"><span class="dot"></span>演示数据</span></header>
  <main id="app"></main>
  <div class="switcher" aria-label="切换原型布局">
    <button aria-label="上一种布局" onclick="variant(-1)">←</button><span id="variantlabel"></span><button aria-label="下一种布局" onclick="variant(1)">→</button>
  </div>
  <div id="modal"></div>
<script src="knowledge-data.js"></script><script>
// Throwaway UI prototype: three structural home variants, selected through ?variant=A/B/C. All mutations are in memory.
const $=s=>document.querySelector(s);const names=['首页','看板','业务知识','数据接入','AI接入'];const icons=['⌂','▦','▤','⇄','⌘'];let page=0,period='本月';let v=new URLSearchParams(location.search).get('variant')||'A';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}function variant(n){v=['A','B','C'][(['A','B','C'].indexOf(v)+n+3)%3];let u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);page=0;render()}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')variant(-1);if(e.key==='ArrowRight')variant(1)});
const dashboards = [
  { id: 'sales', name: '电商销售总览', description: '微信小程序、平台电商及其他渠道的成交与退款', type: 'sales', favorite: true, archived: false, source: 'MCP', cards: ['sales-trend', 'channel-sales'], version: 1 },
  { id: 'inventory', name: '双仓库存与缺货', description: '按仓库查看可用库存、临期和缺货情况', type: 'inventory', favorite: true, archived: false, source: 'MCP', cards: ['inventory-health'], version: 1 },
  { id: 'processing', name: '加工损耗与入库核对', description: '按加工批次核对投料、报损、合格产出和入库重量', type: 'processing', favorite: true, archived: false, source: 'MCP', cards: ['processing-loss'], version: 1 },
  { id: 'channel', name: '直播经营复盘', description: '按直播场次比较成交与退款，查看整体渠道结构', type: 'channel', favorite: true, archived: false, source: 'Skill', cards: ['live-performance', 'channel-sales'], version: 1 }
];
const chartLibrary = [
  { id: 'sales-trend', name: '销售额趋势', kind: 'line', dataset: '商城订单与退款', topic: 'sales', knowledgeVersion: 'v1' },
  { id: 'channel-sales', name: '渠道销售额分布', kind: 'bar', dataset: '商城订单与退款', topic: 'sales', knowledgeVersion: 'v1' },
  { id: 'inventory-health', name: '仓库库存快照', kind: 'inventory', dataset: 'WMS 库存快照', topic: 'inventory', knowledgeVersion: 'v1' },
  { id: 'processing-loss', name: '加工批次与损耗', kind: 'processing', dataset: 'ERP 加工单 · WMS 入库单', topic: 'processing', knowledgeVersion: 'v1' },
  { id: 'live-performance', name: '按场次看成交与退款', kind: 'live', dataset: '直播平台订单 · 商城退款', topic: 'live', knowledgeVersion: 'v1' }
];
let activeId=new URLSearchParams(location.search).get('board'),boardFilter='all',boardSearch='',sequence=0,editing=false;
const current=()=>dashboards.find(b=>b.id===activeId);
function boardUrl(){let u=new URL(location);if(activeId)u.searchParams.set('board',activeId);else u.searchParams.delete('board');history.replaceState(null,'',u)}
let initialBoard=new URLSearchParams(location.search).get('board');
function go(n){page=n;activeId=null;editing=false;boardUrl();render();window.scrollTo(0,0)}
function openBoard(id){activeId=id;page=1;editing=false;boardUrl();render();window.scrollTo(0,0)}
const boardIcons = { sales: '↗', inventory: '▦', processing: '◫', channel: '▷', custom: '▤' };

function favorite(id) {
  const board = dashboards.find(item => item.id === id);
  board.favorite = !board.favorite;
  render();
}

function boards(items) {
  if (!items.length) {
    return '<div class="card"><h3>暂无匹配看板</h3><p class="muted">修改搜索条件，或创建一个新看板。</p></div>';
  }
  return items.map(board => `<article class="card board-card">
    <div class="row">
      <span class="board-icon" aria-hidden="true">${boardIcons[board.type] || boardIcons.custom}</span>
      <button class="favorite-button" aria-label="收藏 ${esc(board.name)}" aria-pressed="${board.favorite}" onclick="favorite('${board.id}')">${board.favorite ? '★' : '☆'}</button>
    </div>
    <div><button class="board-open" onclick="openBoard('${board.id}')">${esc(board.name)} <span aria-hidden="true">↗</span></button>
      <p class="muted">${esc(board.description)}</p></div>
    <footer class="row"><span class="muted">${board.cards.length} 张图表${board.archived ? ' · 已归档' : ''}</span>
      <button class="text-button" aria-label="复制 ${esc(board.name)}" onclick="boardDialog('${board.id}')">复制</button></footer>
  </article>`).join('');
}

function home() {
  const activeBoards = dashboards.filter(board => !board.archived);
  const hero = `<section class="hero-band">
    <div class="hero-copy"><h1>生鲜经营总览</h1><p>查看电商销售、双仓库存、加工损耗和直播经营。</p>
      <div class="hero-actions"><button class="primary" onclick="boardDialog()">＋ 新建看板</button>
        <button class="secondary-dark" onclick="go(1)">所有看板 →</button></div>
    </div>${operationsSummary()}</section>`;

  if (v === 'B') {
    return `${hero}<section class="section"><h2>销售表现</h2>${kpis()}${charts()}</section>
      <section class="section"><h2>团队看板</h2><div class="grid board-grid">${boards(activeBoards)}</div></section>`;
  }
  if (v === 'C') {
    const rows = activeBoards.map(board => [
      `<button class="text-button" onclick="openBoard('${board.id}')">${esc(board.name)}</button>`, board.source, 'v' + board.version
    ]);
    return `${hero}<div class="editorhome section">
      <section class="card"><h2>团队看板</h2>${operationTable(['看板', '来源', '版本'], rows)}</section>
      <section class="card"><h2>业务知识</h2><p class="muted">查阅看板与外部工具共用的指标口径。</p>
        <button onclick="openKnowledge()">阅读业务知识 →</button>
        <h2 class="section">AI接入</h2><button onclick="go(4)">管理 API Key →</button></section></div>`;
  }
  return `${hero}<section class="section"><div class="row board-section-head"><h2>收藏看板</h2>
    <button class="text-button" onclick="go(1)">查看全部 →</button></div>
    <div class="grid board-grid">${boards(activeBoards.filter(board => board.favorite))}</div></section>`;
}

function boardList() {
  const filters = [['all', '全部'], ['favorites', '收藏'], ['archived', '已归档']];
  return `<div class="row"><div><h1>团队看板</h1>
    <p class="muted">${dashboards.filter(board => !board.archived).length} 个有效看板</p></div>
    <button class="primary" onclick="boardDialog()">＋ 新建看板</button></div>
    <div class="row board-filters"><div class="tabs" aria-label="看板状态">
      ${filters.map(([key, name]) => `<button aria-pressed="${boardFilter === key}" class="${boardFilter === key ? 'on' : ''}" onclick="boardFilter='${key}';render()">${name}</button>`).join('')}
    </div><input aria-label="搜索看板" placeholder="搜索看板名称" value="${esc(boardSearch)}"
      oninput="boardSearch=this.value;document.querySelector('#boardcards').innerHTML=filteredBoards()"></div>
    <div id="boardcards" class="grid board-grid section">${filteredBoards()}</div>`;
}
function filteredBoards(){return boards(dashboards.filter(b=>(boardFilter==='archived'?b.archived:!b.archived)&&(boardFilter!=='favorites'||b.favorite)&&b.name.toLowerCase().includes(boardSearch.toLowerCase())))}
function boardDialog(copyId){let original=dashboards.find(b=>b.id===copyId);modal(`<div class="row"><h2>${original?'复制':'新建'}看板</h2><button onclick="closeModal()">×</button></div><label class="field">名称<input id="boardname" value="${original?esc(original.name+' 副本'):''}" placeholder="例如：月度经营分析"></label><label class="field">说明<input id="boarddesc" value="${original?esc(original.description):''}"></label><label class="field">空间<select><option>经营分析空间</option></select></label><p class="muted">${original?'复制布局和筛选，图表沿用共享定义。':'创建空白看板后，从已有图表添加内容，或通过外部 MCP / Skill 填充。'}</p><button class="primary" onclick="createBoard('${copyId||''}')">${original?'创建副本':'创建看板'}</button>`)}
function createBoard(copyId){let name=$('#boardname').value.trim();if(!name){toast('请填写看板名称');return}let original=dashboards.find(b=>b.id===copyId);let b={id:'board-'+(++sequence),name,description:$('#boarddesc').value,source:'手动',favorite:false,archived:false,type:original?.type||'custom',cards:original?[...original.cards]:[],warehouse:original?.warehouse||'',version:1};dashboards.push(b);closeModal();openBoard(b.id);toast('已创建看板 · 当前演示会话内有效')}
function kpis(){let vals=period==='本月'?['¥ 128.6 万','8,426','¥ 152.6','3.8%']:['¥ 141.2 万','8,982','¥ 157.2','4.1%'];return `<div class="kpis">${['净销售额','支付订单数','客单价','退款率'].map((t,i)=>`<div class="card"><span class="muted">${t}</span><div class="value">${vals[i]}</div><span class="${i===3?'up':'down'}">↘ ${['8.9','6.2','2.9','0.3'][i]}${i===3?' 个百分点':'%'} <span class="muted">较上月同期</span></span></div>`).join('')}</div>`}
function line(){return `<svg class="chart" viewBox="0 0 600 225" role="img" aria-label="销售趋势图">${[40,85,130,175].map((y,i)=>`<line x1="45" x2="580" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="0" y="${y+4}">${[8,6,4,2][i]}万</text>`).join('')}<path d="M45 145 L95 120 L145 135 L195 75 L245 95 L295 60 L345 85 L395 56 L445 90 L495 65 L545 83 L580 55" fill="none" stroke="#a8acb3" stroke-width="2" stroke-dasharray="5 5"/><path d="M45 150 L95 128 L145 140 L195 96 L245 103 L295 88 L345 128 L395 121 L445 145 L495 128 L545 150 L580 135 L580 185 L45 185Z" fill="#edf3ff"/><path d="M45 150 L95 128 L145 140 L195 96 L245 103 L295 88 L345 128 L395 121 L445 145 L495 128 L545 150 L580 135" fill="none" stroke="#0052ff" stroke-width="3"/>${['11/01','11/05','11/10','11/15','11/20','11/25'].map((t,i)=>`<text x="${45+i*102}" y="210">${t}</text>`).join('')}</svg>`}
function bars(){return `<div style="height:230px;padding-top:20px">${[['微信小程序',54,'#0052ff'],['平台电商',38.7,'#628fff'],['直播渠道',25.6,'#a2bbff'],['其他渠道',10.3,'#dbe6ff']].map(([t,w,c])=>`<div style="display:flex;align-items:center;gap:15px;margin:22px 0;font-size:12px"><span style="min-width:69px">${t}</span><div style="width:${w/54*64}%;height:17px;border-radius:3px;background:${c}"></div><span class="muted">${w.toFixed(1)}万</span></div>`).join('')}</div>`}
function charts(){return `<div class="chartgrid"><div class="card"><div class="row"><h3>销售额趋势</h3><span class="legend"><span class="dot"></span>本月　 ┄ 上月同期</span></div>${line()}</div><div class="card"><h3>渠道销售额分布</h3>${bars()}</div></div>`}
const warehouseSamples = [
  { warehouse: '一号仓', available: 6000, nearExpiry: 720, shortages: 2 },
  { warehouse: '二号仓', available: 5000, nearExpiry: 160, shortages: 1 }
];
const processingSamples = [
  { batch: 'JG-1125-01', warehouse: '一号仓', input: 1000, output: 960, waste: 40, received: 960 },
  { batch: 'JG-1125-02', warehouse: '二号仓', input: 800, output: 712, waste: 88, received: 680 }
];
const liveSamples = [
  { session: '直播 A · 11 月 25 日', paid: 18600, refund: 600 },
  { session: '直播 B · 11 月 25 日', paid: 14200, refund: 2200 },
  { session: '直播 C · 11 月 25 日', paid: 9400, refund: 400 }
];
const lossRate = row => row.waste / row.input * 100;
const reviewBatch = processingSamples.find(row => lossRate(row) > 6 && row.output !== row.received);
const formatNumber = value => value.toLocaleString('zh-CN');
const scopedWarehouseRows = rows => rows.filter(row => !current()?.warehouse || current().warehouse === row.warehouse);

function operationTable(headers, rows) {
  return `<div class="table-scroll"><table class="list"><thead><tr>${headers.map(header => `<th scope="col">${header}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(value => `<td>${value}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function warehouseChart() {
  return `<p class="muted">库存快照 · 11 月 25 日 10:20 · 临期指未来 3 天到期</p>${operationTable(
    ['仓库', '可用库存（件）', '临期可用库存（件）', '缺货 SKU'],
    scopedWarehouseRows(warehouseSamples).map(row => [row.warehouse, formatNumber(row.available), row.nearExpiry, row.shortages])
  )}`;
}

function processingChart() {
  return `<p class="muted">11 月 25 日已完工批次 · 重量单位为 kg · 复核线为 6%（示例）</p>${operationTable(
    ['批次', '仓库', '投料', '合格产出', '报损', '损耗率', 'WMS 已入库', '核对'],
    scopedWarehouseRows(processingSamples).map(row => [
      row.batch, row.warehouse, formatNumber(row.input), row.output, row.waste,
      lossRate(row) > 6 ? `<strong class="attention">${lossRate(row).toFixed(1)}%</strong>` : `${lossRate(row).toFixed(1)}%`,
      row.received, `<button onclick="batchDetail('${row.batch}')">查看批次</button>`
    ])
  )}`;
}

function liveChart() {
  return `<p class="muted">只统计可匹配直播场次的支付订单 · 退款截至 11 月 26 日 09:00</p>${operationTable(
    ['直播场次', '支付成交额（元）', '已退款（元）', '退款后成交额（元）'],
    liveSamples.map(row => [row.session, formatNumber(row.paid), formatNumber(row.refund), formatNumber(row.paid - row.refund)])
  )}`;
}

function batchDetail(id) {
  const row = processingSamples.find(batch => batch.batch === id);
  modal(`<div class="row"><h2>${row.batch} · ${row.warehouse}</h2><button onclick="closeModal()" aria-label="关闭">×</button></div>
    <table class="list"><tr><th>来源</th><th>批次记录</th></tr>
    <tr><td>ERP 加工完工单</td><td>投料 ${row.input} kg，合格产出 ${row.output} kg，报损 ${row.waste} kg</td></tr>
    <tr><td>WMS 入库汇总</td><td>已确认入库 ${row.received} kg</td></tr></table>
    <p>加工损耗率 <strong>${lossRate(row).toFixed(1)}%</strong> · 复核线 6%</p>
    <p>合格产出与入库记录相差 <strong>${row.output - row.received} kg</strong></p>
    <p class="muted">${row.output !== row.received ? '待核对入库单状态、同步时间和称重记录。入库差额需单独跟踪。' : '当前样例中合格产出与已入库重量一致。'}</p>
    <button onclick="closeModal();openKnowledge('processing','v1')">查看损耗口径 →</button>`);
}

function operationsSummary() {
  const board = dashboards.find(item => item.id === 'processing');
  if (board.archived) return '';
  return `<section class="operations-watch">
    <span class="tag">待复核 · ${reviewBatch.warehouse}</span>
    <div class="watch-number numeric">${lossRate(reviewBatch).toFixed(1)}%</div>
    <h2>加工损耗率</h2>
    <p>批次 ${reviewBatch.batch} · 入库差额 ${reviewBatch.output - reviewBatch.received} kg</p>
    <button class="text-button" onclick="openBoard('processing')">打开加工损耗看板 →</button>
  </section>`;
}

function boardScope(board) {
  if (['inventory', 'processing'].includes(board.type)) {
    return `<select aria-label="仓库" onchange="current().warehouse=this.value;render()">
      ${[['', '全部仓库'], ['一号仓', '一号仓'], ['二号仓', '二号仓']].map(([value, label]) => `<option value="${value}" ${(board.warehouse || '') === value ? 'selected' : ''}>${label}</option>`).join('')}
    </select> <span class="muted">11 月 25 日示例 · 筛选库存和加工卡片</span>`;
  }
  const captions = { sales: '11 月 1–25 日销售样例', channel: '11 月 25 日直播场次样例' };
  return `<span class="muted">${captions[board.type] || '演示数据'}</span>`;
}

function sourceReconciliation() {
  return `<section class="card section"><h2>业务数据如何对齐</h2>${operationTable(
    ['业务记录', '演示来源', '用于关联的标识', '核对项'],
    [
      ['订单与退款', '微信小程序 / 商城、ERP', '来源渠道＋平台订单号', '支付、退款与 ERP 订单状态'],
      ['库存与发货', 'WMS', '仓库＋SKU＋批次、履约单号', '可用库存、出入库和签收状态（有回传时）'],
      ['加工投入与产出', 'ERP 加工单、WMS 入库单', '仓库＋加工批次', '完工产出与已入库重量'],
      ['直播归因', '平台接口', '平台＋直播场次＋平台订单号', '只计入可匹配场次的订单']
    ]
  )}<p class="muted">示例沿用 MySQL、PostgreSQL 和 API 的接入方式。系统、字段和同步时效需现场确认。</p></section>`;
}

const chartBodies = { line, bar: bars, inventory: warehouseChart, processing: processingChart, live: liveChart };
function chartCard(id) {
  const chart = chartLibrary.find(item => item.id === id);
  return `<div class="card"><div class="row"><h3>${chart.name}</h3>
    ${editing ? `<button onclick="removeCard('${id}')">移除</button>` : ''}</div>
    ${chartBodies[chart.kind]()}
    <p class="muted">来源 · ${chart.dataset}</p>
    <button class="knowledge-link" onclick="openKnowledge('${chart.topic}','${chart.knowledgeVersion}')">查看口径 · ${chart.knowledgeVersion} →</button></div>`;
}
function dashboard() {
  const board = current();
  if (!board) return boardList();

  const options = dashboards.filter(item => !item.archived || item.id === board.id).map(item =>
    `<option value="${item.id}" ${item.id === board.id ? 'selected' : ''}>${esc(item.name)}</option>`
  );
  return `<div class="row detail-nav">
    <button class="text-button" onclick="go(1)">← 所有看板</button>
    <select aria-label="切换看板" onchange="openBoard(this.value)">${options.join('')}</select>
  </div>
  <div class="row"><div><h1>${esc(board.name)}</h1><p class="muted">${esc(board.description)}</p></div>
    <span class="tag">${board.archived ? '已归档' : 'v' + board.version}</span>
  </div>
  <div class="row section detail-toolbar"><div class="detail-actions">${boardScope(board)}</div>
    <div class="detail-actions">
      <button aria-pressed="${board.favorite}" onclick="favorite('${board.id}')">${board.favorite ? '★ 已收藏' : '☆ 收藏'}</button>
      <button onclick="boardDialog('${board.id}')">复制</button>
      <button onclick="shareBoard()">分享</button>
      <button onclick="archiveDialog()">${board.archived ? '恢复' : '归档'}</button>
      <button onclick="toast('已刷新当前看板的演示结果')">↻ 刷新</button>
      ${board.archived || !board.cards.length ? '' : '<button onclick="addChartDialog()">＋ 添加已有图表</button>'}
      ${board.archived ? '' : `<button class="primary" onclick="editing=!editing;if(!editing)current().version++;render()">${editing ? '完成编辑' : '编辑看板'}</button>`}
    </div>
  </div>
  ${editing ? `<div class="row insight"><span>可改名或调整当前看板的图表。</span><div class="detail-actions">
    <button onclick="renameDialog()">修改名称</button>${board.cards.length ? '' : '<button onclick="addChartDialog()">＋ 添加已有图表</button>'}</div></div>` : ''}
  ${board.cards.length ? `<div class="${board.cards.length > 1 ? 'chartgrid equal' : ''} section">${board.cards.map(chartCard).join('')}</div>` :
    `<section class="card section"><h2>这个看板还没有图表</h2><p class="muted">从已有图表中选择，或通过外部 MCP / Skill 创建。</p>
      ${board.archived || editing ? '' : '<button class="primary" onclick="addChartDialog()">＋ 添加已有图表</button>'}</section>`}
  <p class="muted section">${board.cards.length} 张图表 · ${board.source}创建</p>`;
}
function addChartDialog(){let b=current();modal(`<div class="row"><h2>添加已有图表</h2><button onclick="closeModal()">×</button></div><p class="muted">添加共享图表引用，不修改原图表定义。</p>${chartLibrary.map(c=>`<div class="row section"><div><b>${c.name}</b><p class="muted">${c.dataset}</p></div><button ${b.cards.includes(c.id)?'disabled':''} onclick="current().cards.push('${c.id}');current().version++;closeModal();render()">${b.cards.includes(c.id)?'已添加':'添加'}</button></div>`).join('')}`)}
function removeCard(id){let b=current();b.cards=b.cards.filter(x=>x!==id);render()}
function renameDialog(){modal(`<h2>修改看板名称</h2><label class="field">名称<input id="rename" value="${esc(current().name)}"></label><button class="primary" onclick="let n=$('#rename').value.trim();if(n){current().name=n;closeModal();render()}else toast('名称不能为空')">应用</button>`)}
function archiveDialog(){let b=current();modal(`<h2>${b.archived?'恢复':'归档'}看板</h2><p>${esc(b.name)}</p><p class="muted">${b.archived?'恢复后回到有效看板列表。':'归档后从默认列表移除，保留内容，可在已归档列表恢复。'}</p><button onclick="closeModal()">取消</button> <button class="primary" onclick="current().archived=!current().archived;closeModal();go(1)">确认</button>`)}
function shareBoard(){let u=new URL(location);u.searchParams.set('board',activeId);modal(`<h2>看板独立链接</h2><pre id="boardlink">${esc(u.href)}</pre><p class="muted">访问仍需空间和数据权限。示例内置看板可刷新直达；新建看板仅存在当前会话，尚不支持跨浏览器共享。</p><button onclick="copyText($('#boardlink').textContent)">复制链接</button> <button onclick="closeModal()">关闭</button>`)}
let knowledgeTopic = null;
let knowledgeVersion = null;
let knowledgeReturnBoard = null;

function knowledgeVersions(topic) {
  const documents = typeof knowledgeDocuments === 'undefined' ? {} : knowledgeDocuments;
  return documents[topic] || {};
}

function newestKnowledgeVersion(versions) {
  return Object.keys(versions).sort((a, b) => Number(b.slice(1)) - Number(a.slice(1)))[0];
}

function currentKnowledge() {
  const versions = knowledgeVersions(knowledgeTopic);
  return versions[knowledgeVersion || newestKnowledgeVersion(versions)];
}

function openKnowledge(topic = null, version = null) {
  if (page === 1) knowledgeReturnBoard = activeId;
  if (!topic) knowledgeReturnBoard = null;
  knowledgeTopic = topic;
  knowledgeVersion = version;
  go(2);
}

function knowledge() {
  if (!knowledgeTopic) {
    const documents = typeof knowledgeDocuments === 'undefined' ? {} : knowledgeDocuments;
    const topics = Object.entries(documents);
    return `<h1>业务知识</h1><p class="muted">查阅已部署的指标口径、使用规则和数据来源。</p>
      <div class="grid section">${topics.length ? topics.map(([topic, versions]) => {
        const version = newestKnowledgeVersion(versions);
        const doc = versions[version];
        return `<article class="card knowledge-topic"><span class="tag">${version}</span>
          <h2>${esc(doc.title)}</h2><p>${esc(doc.summary)}</p>
          <button onclick="openKnowledge('${topic}')">阅读文档 →</button></article>`;
      }).join('') : '<p>暂未加载业务知识，请检查部署的知识文件。</p>'}</div>`;
  }

  const versions = knowledgeVersions(knowledgeTopic);
  const selectedVersion = knowledgeVersion || newestKnowledgeVersion(versions);
  const doc = currentKnowledge();
  const navigation = `<div class="knowledge-actions"><button onclick="openKnowledge()">← 业务知识</button>
    ${knowledgeReturnBoard ? '<button onclick="openBoard(knowledgeReturnBoard)">返回看板</button>' : ''}</div>`;
  if (!doc) {
    return `${navigation}<section class="card section"><h1>口径版本暂不可用</h1>
      <p>未找到 ${esc(knowledgeTopic)} ${esc(selectedVersion || '')}。请核对看板引用和部署版本。</p></section>`;
  }
  const availableVersions = Object.keys(versions).sort((a, b) => Number(b.slice(1)) - Number(a.slice(1)));
  return `${navigation}<article class="card knowledge-document section">
    <div class="row knowledge-heading"><h1>${esc(doc.title)}</h1>
      ${availableVersions.length > 1
        ? `<label>文档版本 <select aria-label="文档版本" onchange="openKnowledge('${knowledgeTopic}',this.value)">
          ${availableVersions.map(version => `<option ${version === selectedVersion ? 'selected' : ''}>${version}</option>`).join('')}
        </select></label>`
        : `<span class="tag">${selectedVersion}</span>`}</div>
    ${doc.html}
    <p class="knowledge-source"><a href="../${esc(doc.source)}">查看 Markdown 源文件</a></p>
  </article>`;
}
function sources(){return `<div class="row"><div><h1>数据接入</h1><p class="muted">管理数据库和业务 API 连接。</p></div><button class="primary" onclick="connect()">＋ 添加数据源</button></div><div class="grid section">${[['PG','ERP 经营数据','PostgreSQL · 演示映射'],['MY','商城与小程序','MySQL · 演示映射'],['API','WMS 与平台接口','API · 演示映射']].map(([i,n,d])=>`<div class="card"><div class="sourceicon">${i}</div><div class="row"><h3>${n}</h3><span class="tag">● 正常</span></div><p class="muted">${d}</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="row"><span class="muted">最近检测 10:30</span><button onclick="connect('${i==='PG'?'PostgreSQL':i==='MY'?'MySQL':'API'}')">配置 →</button></div></div>`).join('')}</div><div class="insight"><b>从连接到可分析，还差一步业务理解</b><br>接入后补充字段说明、指标口径和表关联，为查询与外部分析工具提供一致的业务口径。</div>${sourceReconciliation()}`}
function modal(s){$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
function connect(type='PostgreSQL'){modal(`<div class="row"><h2>配置数据源</h2><button onclick="closeModal()">×</button></div><label class="field">连接类型<select id="ctype" onchange="connect(this.value)">${['PostgreSQL','MySQL','API'].map(t=>`<option ${type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">显示名称<input placeholder="例如：经营数据库"></label>${type==='API'?`<label class="field">API 模式<select><option>参数化查询 API</option><option>明细数据集 API</option></select></label><label class="field">接口 URL<input placeholder="https://internal.example/api/inventory"></label><label class="field">鉴权方式<select><option>Bearer Token</option><option>自定义 Header</option></select></label><label class="field">返回数据路径<input placeholder="data.items"></label><p class="muted">后续配置参数、字段含义、聚合限制和刷新策略。</p>`:`<label class="field">主机<input placeholder="db.internal.example"></label><div class="row"><label class="field">端口<input value="${type==='MySQL'?'3306':'5432'}"></label><label class="field">数据库<input placeholder="business"></label></div><label class="field">只读账号<input placeholder="analytics_reader"></label><label class="field">密码<input type="password" placeholder="输入连接密码"></label>`}<div class="row"><button onclick="$('#testresult').textContent='✓ 演示连接测试通过；未访问真实服务'">测试连接</button><button class="primary" onclick="closeModal();toast('接入配置已完成演示；未建立真实连接')">保存配置</button></div><p id="testresult" class="up"></p>`)}
let keys=[];
function integration(){return `<div class="row"><div><h1>AI接入</h1><p class="muted">在外部 AI 工具中分析数据，结果保存到 DataCube 的图表和看板。</p></div><button class="primary" onclick="keyDialog()">＋ 创建 API Key</button></div><div class="chartgrid section"><div class="card"><span class="tag">MCP</span><h2>连接外部 AI 客户端</h2><p>服务地址</p><pre>https://datacube.example.internal/mcp</pre><p class="muted">示例地址 · 将地址与 API Key 配置到支持 MCP 的客户端。</p><h3 class="section">可授权的能力</h3><p style="line-height:2">读取已部署的 Markdown 业务知识 · 执行只读查询<br>创建图表 · 按 ID 更新看板 · 读取执行状态</p><button onclick="configDialog()">查看连接配置</button></div><div class="card"><span class="tag">SKILL</span><h2>通过 Skill 使用</h2><p style="line-height:1.9">Skill 指导外部 Agent 理解平台指标和调用流程，通过 MCP 或平台 API 执行操作。沿用同一 API Key 权限。</p><ol style="line-height:2.2"><li>安装企业提供的 DataCube Skill</li><li>配置平台地址与 API Key</li><li>在外部工具中查数或生成看板</li><li>回到平台查看与管理结果</li></ol><p class="muted">原型仅展示接入流程，尚未交付真实 MCP 服务或 Skill 安装包。</p></div></div><div class="card section"><h3>API Keys</h3><p class="muted">Key 绑定创建者、业务空间及授权范围。完整密钥仅在创建时展示一次。</p><table class="list"><tr><th>名称</th><th>标识</th><th>权限</th><th>到期时间</th><th>状态</th><th></th></tr>${keys.length?keys.map((k,i)=>`<tr><td>${esc(k.name)}</td><td>dc_demo_••••${i+1000}</td><td>${k.write?'查询、创建图表与看板':'只读查询'}</td><td>30 天后</td><td>${k.revoked?'已撤销':'有效'}</td><td><button ${k.revoked?'disabled':''} onclick="keys[${i}].revoked=true;render();toast('演示 Key 已撤销')">撤销</button></td></tr>`).join(''):'<tr><td colspan="6">暂无 API Key，创建后可配置到外部客户端。</td></tr>'}</table></div>`}
function keyDialog(){modal(`<div class="row"><h2>创建 API Key</h2><button onclick="closeModal()">×</button></div><label class="field">名称<input id="keyname" placeholder="例如：个人分析工具"></label><label class="field">业务空间<select><option>经营分析空间</option></select></label><label class="field">授权范围<select id="keyscope"><option value="read">只读查询</option><option value="write">查询 + 创建图表与看板</option></select></label><label class="field">有效期<select><option>30 天</option></select></label><p class="muted">权限不超过创建者已有权限，不能修改业务数据。</p><button class="primary" onclick="createKey()">创建</button>`)}
function createKey(){let name=$('#keyname').value.trim();if(!name){toast('请填写 Key 名称');return}keys.push({name,write:$('#keyscope').value==='write',revoked:false});render();modal(`<h2>API Key 已创建</h2><p>请复制并保存，关闭后不再展示完整内容。</p><pre id="newkey">dc_demo_not_a_real_secret_${keys.length}</pre><p class="muted">这是不可用于鉴权的演示字符串，请勿输入真实凭据。</p><button onclick="copyText($('#newkey').textContent)">复制演示 Key</button> <button class="primary" onclick="closeModal()">已保存，关闭</button>`)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('请手动选择文本复制'));else toast('请手动选择文本复制')}
function configDialog(){modal(`<h2>MCP 客户端连接配置</h2><pre>{
  "url": "https://datacube.example.internal/mcp",
  "headers": {
    "Authorization": "Bearer &lt;DATACUBE_API_KEY&gt;"
  }
}</pre><p class="muted">概念配置，实际字段名由客户端决定；API Key 是平台访问凭据，不是模型供应商密钥。</p><button onclick="closeModal()">关闭</button>`)}
function render(){$('#nav').innerHTML=names.map((n,i)=>`<button class="${page===i?'active':''}" aria-current="${page===i?'page':'false'}" onclick="${i===2?'openKnowledge()':'go('+i+')'}"><span class="navicon" aria-hidden="true">${icons[i]}</span>${n}</button>`).join('');$('#crumb').textContent=page===1&&current()?'看板 / '+current().name:page===2&&currentKnowledge()?'业务知识 / '+currentKnowledge().title:names[page];$('#variantlabel').textContent=`原型 ${v} · ${{A:'资产导航优先',B:'经营概览优先',C:'团队资产优先'}[v]}`;$('#app').innerHTML=[home,dashboard,knowledge,sources,integration][page]()}if(dashboards.some(b=>b.id===initialBoard)){activeId=initialBoard;page=1}render();
</script></body></html>
