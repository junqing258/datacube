:root{--bg:#f6f8fa;--ink:#172c31;--muted:#809095;--line:#e4eaeb;--green:#157b65;--soft:#eaf4ef}*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 15px}button:hover{border-color:var(--green);background:#f2f8f5}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#10634f;color:white}aside{position:fixed;inset:0 auto 0 0;width:220px;background:#fff;border-right:1px solid var(--line);padding:30px 18px;display:flex;flex-direction:column}.brand{font-size:23px;font-weight:750;letter-spacing:-1px;padding:0 12px 30px}.logo{display:inline-block;color:var(--green);margin-right:9px}.space{background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:8px;margin-bottom:25px;font-size:12px}nav button{display:block;width:100%;text-align:left;border:0;margin:5px 0;padding:13px 15px;color:#617377;background:transparent}nav button.active{background:var(--soft);color:var(--green);font-weight:650}.navicon{display:inline-block;width:28px}.asidebottom{margin-top:auto;font-size:12px;color:var(--muted);padding:15px}.avatar{background:#dcebe6;border-radius:50%;padding:8px;color:var(--green);margin-right:8px}header{height:76px;border-bottom:1px solid var(--line);background:#ffffffc9;display:flex;align-items:center;justify-content:space-between;padding:0 40px;margin-left:220px;font-size:13px;color:#74858a}header b{color:var(--ink)}main{margin-left:220px;padding:35px 40px 100px;max-width:1800px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.muted{color:var(--muted);font-size:12px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:30px;font-weight:650;letter-spacing:-1px;margin:12px 0}h2{font-size:18px;font-weight:650}h3{font-size:14px;margin:0 0 14px}.hero{max-width:850px;margin:50px auto 44px;text-align:center}.hero p{color:#7e8e92;line-height:1.8}.askbox{background:white;border:1px solid #b8d2c8;border-radius:15px;padding:18px;text-align:left;box-shadow:0 8px 35px #1b554c08;margin-top:28px}.askbox textarea{border:0;resize:none;outline:none;width:100%;height:65px;background:transparent;color:var(--ink)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chips button{font-size:12px;color:#60777a;background:#fff;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.click{cursor:pointer}.click:hover{box-shadow:0 8px 24px #173e3009;border-color:#aacfc0}.tag{font-size:10px;padding:4px 7px;background:var(--soft);color:var(--green);border-radius:4px}.mini{height:78px;display:flex;align-items:end;gap:7px;margin:24px 0}.mini i{flex:1;background:#a7cebf;border-radius:3px 3px 0 0}.section{margin-top:30px}.list{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;border-bottom:1px solid var(--line);padding:17px;font-size:13px}th{font-size:11px;color:var(--muted);font-weight:500}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.value{font-size:29px;font-weight:650;letter-spacing:-1px;margin:12px 0}.down{color:#c47a58;font-size:12px}.up{color:var(--green);font-size:12px}.chartgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}.chart{width:100%;height:230px}.chart text{font-size:10px;fill:#8c999c}.legend{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.workspace{display:grid;grid-template-columns:310px 1fr;gap:22px;margin-top:24px}.chat{background:#edf2ef;padding:22px;border-radius:12px;min-height:620px}.bubble{background:white;padding:15px;border-radius:9px;font-size:13px;line-height:1.8;margin:15px 0}.bubble.user{background:#dcebe3}.steps{font-size:12px;line-height:2.5;color:#5e7770}.insight{border-left:3px solid var(--green);padding:15px 20px;background:#eff6f2;line-height:1.9;margin-top:18px;font-size:13px}.tabs{display:flex;gap:6px;margin:20px 0}.tabs button.on{color:var(--green);background:var(--soft)}pre{white-space:pre-wrap;background:#172e32;color:#d2e8df;padding:22px;border-radius:9px;line-height:1.8;font-size:12px}.switcher{position:fixed;bottom:19px;left:calc(50% + 110px);transform:translateX(-50%);background:#183337;color:white;padding:7px;border-radius:30px;box-shadow:0 4px 20px #152b3025;display:flex;align-items:center;gap:12px;font-size:11px;z-index:15}.switcher button{background:transparent;color:white;border:0;padding:6px 12px}.toast{position:fixed;right:30px;bottom:35px;background:#173d32;color:white;padding:15px 25px;border-radius:10px;z-index:40}.overlay{position:fixed;inset:0;background:#102e3466;display:flex;align-items:center;justify-content:center;z-index:30}.modal{background:white;border-radius:15px;padding:30px;width:520px;max-height:90vh;overflow:auto}.field{display:block;margin:18px 0;font-size:12px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:11px;margin-top:8px}.sourceicon{width:44px;height:44px;display:grid;place-items:center;background:#eff5f4;border-radius:10px;color:var(--green);font-weight:700;margin-bottom:18px}.banner{font-size:11px;background:#fff8e9;color:#9d7c37;padding:8px 15px;border-radius:6px;margin-bottom:22px}.compacthome .hero{margin:0;text-align:left;max-width:none}.compacthome .askbox{max-width:none}.editorhome{display:grid;grid-template-columns:1fr 1.4fr;gap:25px}.editorhome .hero{text-align:left;margin:20px 0}.editorhome .grid{grid-template-columns:1fr}.editorhome .mini{display:none}@media(max-width:1000px){aside{width:175px}main,header{margin-left:175px}main{padding:25px 22px 90px}.grid,.kpis{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:250px 1fr}.chartgrid,.editorhome{grid-template-columns:1fr}.switcher{left:55%}}@media(max-width:700px){aside{position:static;width:100%;padding:15px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.brand{padding-bottom:10px}.space,.asidebottom{display:none}main,header{margin-left:0}header{padding:0 20px;height:50px}.workspace,.grid,.kpis{grid-template-columns:1fr}.chat{min-height:auto}.hero{margin:20px auto}.switcher{left:50%;white-space:nowrap}h1{font-size:25px}}

</style></head><body><aside><div class="brand"><span class="logo">◈</span>DataCube<span style="font-size:10px;color:#99aaa7;margin-left:5px">AI</span></div><div class="space">▦　经营分析空间 <span style="float:right">⌄</span></div><nav id="nav"></nav><div class="asidebottom">内部部署 · 演示环境<br><br><span class="avatar">林</span> 林晓 / 业务管理员</div></aside><header><span>工作空间　/　<b id="crumb">首页</b></span><span><span class="dot"></span>数据服务正常　　帮助 ↗</span></header><main id="app"></main><div class="switcher"><button onclick="variant(-1)">←</button><span id="variantlabel"></span><button onclick="variant(1)">→</button></div><div id="modal"></div><script>
// Throwaway UI prototype: three structural home variants, selected through ?variant=A/B/C. All mutations are in memory.
const $=s=>document.querySelector(s);const names=['首页','看板','业务知识','数据接入','MCP / Skill'];const icons=['⌂','▦','▤','⇄','⌘'];let page=0,period='本月';let v=new URLSearchParams(location.search).get('variant')||'A';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2600)}function variant(n){v=['A','B','C'][(['A','B','C'].indexOf(v)+n+3)%3];let u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);page=0;render()}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')variant(-1);if(e.key==='ArrowRight')variant(1)});
const dashboards = [
  { id: 'sales', name: '电商销售总览', description: '微信小程序、平台电商及其他渠道的成交与退款', type: 'sales', favorite: true, archived: false, source: 'MCP', cards: ['sales-trend', 'channel-sales'], version: 1 },
  { id: 'inventory', name: '双仓库存与缺货', description: '按仓库查看可用库存、临期和缺货情况', type: 'inventory', favorite: true, archived: false, source: 'MCP', cards: ['inventory-health'], version: 1 },
  { id: 'processing', name: '加工损耗与入库核对', description: '按加工批次核对投料、报损、合格产出和入库重量', type: 'processing', favorite: true, archived: false, source: 'MCP', cards: ['processing-loss'], version: 1 },
  { id: 'channel', name: '直播经营复盘', description: '按直播场次比较成交与退款，查看整体渠道结构', type: 'channel', favorite: true, archived: false, source: 'Skill', cards: ['live-performance', 'channel-sales'], version: 1 }
];
const chartLibrary = [
  { id: 'sales-trend', name: '销售额趋势', kind: 'line', dataset: '商城订单与退款', metricVersion: 1 },
  { id: 'channel-sales', name: '渠道销售额分布', kind: 'bar', dataset: '商城订单与退款', metricVersion: 1 },
  { id: 'inventory-health', name: '仓库库存快照', kind: 'inventory', dataset: 'WMS 库存快照', topic: 'inventory' },
  { id: 'processing-loss', name: '加工批次与损耗', kind: 'processing', dataset: 'ERP 加工单 · WMS 入库单', topic: 'processing' },
  { id: 'live-performance', name: '按场次看成交与退款', kind: 'live', dataset: '直播平台订单 · 商城退款', topic: 'live' }
];
let activeId=new URLSearchParams(location.search).get('board'),boardFilter='all',boardSearch='',sequence=0,editing=false;
const current=()=>dashboards.find(b=>b.id===activeId);
function boardUrl(){let u=new URL(location);if(activeId)u.searchParams.set('board',activeId);else u.searchParams.delete('board');history.replaceState(null,'',u)}
let initialBoard=new URLSearchParams(location.search).get('board');
function go(n){page=n;activeId=null;editing=false;boardUrl();render();window.scrollTo(0,0)}
function openBoard(id){activeId=id;page=1;editing=false;boardUrl();render();window.scrollTo(0,0)}
function mini(){return '<div class="mini">'+[28,42,35,56,45,68,55,76,60,70,49,64].map(h=>`<i style="height:${h}%"></i>`).join('')+'</div>'}
function favorite(id){let b=dashboards.find(x=>x.id===id);b.favorite=!b.favorite;render()}
function boards(items=dashboards.filter(b=>!b.archived)){return items.length?items.map(b=>`<div class="card"><div class="row"><span class="tag">${b.archived?'已归档':b.source==='手动'?'手动创建':b.source+' 创建'}</span><button aria-label="收藏 ${esc(b.name)}" onclick="favorite('${b.id}')">${b.favorite?'★':'☆'}</button></div><div class="click" onclick="openBoard('${b.id}')">${mini()}<h3>${esc(b.name)}</h3><p class="muted">${esc(b.description)}</p><span class="muted">${b.cards.length} 个图表 · v${b.version}</span></div><div class="row section"><button onclick="openBoard('${b.id}')">打开 →</button><button onclick="boardDialog('${b.id}')">复制</button></div></div>`).join(''):'<div class="card"><h3>暂无匹配看板</h3><p class="muted">修改搜索条件，或创建一个新看板。</p></div>'}
function home(){let intro=`<div class="row"><div><span class="eyebrow">BUSINESS INTELLIGENCE</span><h1>生鲜经营总览</h1><p class="muted">查看电商销售、双仓库存、加工损耗和直播经营。</p></div><button class="primary" onclick="boardDialog()">＋ 新建看板</button></div>`;let recent=`<div class="card section"><h3>团队看板</h3><table class="list"><tr><th>看板</th><th>来源</th><th>版本</th><th></th></tr>${dashboards.filter(b=>!b.archived).map(b=>`<tr><td>${esc(b.name)}</td><td>${b.source}</td><td>v${b.version}</td><td><button onclick="openBoard('${b.id}')">打开 →</button></td></tr>`).join('')}</table></div>`;if(v==='B')return intro+operationsSummary()+kpis()+charts()+`<h2 class="section">全部看板</h2><div class="grid">${boards()}</div>`;if(v==='C')return intro+`<div class="editorhome section"><div class="card"><h2>团队数据资产</h2><p class="muted">维护可供外部 Agent 使用的数据定义。</p><button onclick="openKnowledge()">浏览业务知识 →</button><h2 class="section">外部工具接入</h2><p class="muted">通过 MCP 或 Skill 创建与更新看板。</p><button onclick="go(4)">管理 API Key →</button></div><div>${recent}</div></div>`;return intro+operationsSummary()+`<div class="row section"><h2>收藏看板</h2><button onclick="go(1)">查看全部 →</button></div><div class="grid">${boards(dashboards.filter(b=>b.favorite&&!b.archived))}</div>`+recent}
function boardList(){return `<div class="row"><div><span class="eyebrow">DASHBOARDS</span><h1>团队看板</h1><p class="muted">经营分析空间 · ${dashboards.filter(b=>!b.archived).length} 个有效看板</p></div><button class="primary" onclick="boardDialog()">＋ 新建看板</button></div><div class="row section"><div class="tabs">${[['all','全部'],['favorites','收藏'],['archived','已归档']].map(([k,n])=>`<button class="${boardFilter===k?'on':''}" onclick="boardFilter='${k}';render()">${n}</button>`).join('')}</div><input aria-label="搜索看板" placeholder="搜索看板名称" value="${esc(boardSearch)}" oninput="boardSearch=this.value;document.querySelector('#boardcards').innerHTML=filteredBoards()" style="padding:11px;border:1px solid var(--line);border-radius:8px"></div><div id="boardcards" class="grid">${filteredBoards()}</div>`}
function filteredBoards(){return boards(dashboards.filter(b=>(boardFilter==='archived'?b.archived:!b.archived)&&(boardFilter!=='favorites'||b.favorite)&&b.name.toLowerCase().includes(boardSearch.toLowerCase())))}
function boardDialog(copyId){let original=dashboards.find(b=>b.id===copyId);modal(`<div class="row"><h2>${original?'复制':'新建'}看板</h2><button onclick="closeModal()">×</button></div><label class="field">名称<input id="boardname" value="${original?esc(original.name+' 副本'):''}" placeholder="例如：月度经营分析"></label><label class="field">说明<input id="boarddesc" value="${original?esc(original.description):''}"></label><label class="field">空间<select><option>经营分析空间</option></select></label><p class="muted">${original?'复制布局和筛选，图表沿用共享定义。':'创建空白看板后，从已有图表添加内容，或通过外部 MCP / Skill 填充。'}</p><button class="primary" onclick="createBoard('${copyId||''}')">${original?'创建副本':'创建看板'}</button>`)}
function createBoard(copyId){let name=$('#boardname').value.trim();if(!name){toast('请填写看板名称');return}let original=dashboards.find(b=>b.id===copyId);let b={id:'board-'+(++sequence),name,description:$('#boarddesc').value,source:'手动',favorite:false,archived:false,type:original?.type||'custom',cards:original?[...original.cards]:[],warehouse:original?.warehouse||'',version:1};dashboards.push(b);closeModal();openBoard(b.id);toast('已创建看板 · 当前演示会话内有效')}
function kpis(){let vals=period==='本月'?['¥ 128.6 万','8,426','¥ 152.6','3.8%']:['¥ 141.2 万','8,982','¥ 157.2','4.1%'];return `<div class="kpis">${['净销售额','支付订单数','客单价','退款率'].map((t,i)=>`<div class="card"><span class="muted">${t}</span><div class="value">${vals[i]}</div><span class="${i===3?'up':'down'}">↘ ${['8.9','6.2','2.9','0.3'][i]}${i===3?' 个百分点':'%'} <span class="muted">较上月同期</span></span></div>`).join('')}</div>`}
function line(){return `<svg class="chart" viewBox="0 0 600 225" role="img" aria-label="销售趋势图">${[40,85,130,175].map((y,i)=>`<line x1="45" x2="580" y1="${y}" y2="${y}" stroke="#edf0f0"/><text x="0" y="${y+4}">${[8,6,4,2][i]}万</text>`).join('')}<path d="M45 145 L95 120 L145 135 L195 75 L245 95 L295 60 L345 85 L395 56 L445 90 L495 65 L545 83 L580 55" fill="none" stroke="#c7d6d0" stroke-width="2" stroke-dasharray="5 5"/><path d="M45 150 L95 128 L145 140 L195 96 L245 103 L295 88 L345 128 L395 121 L445 145 L495 128 L545 150 L580 135 L580 185 L45 185Z" fill="#edf5f1"/><path d="M45 150 L95 128 L145 140 L195 96 L245 103 L295 88 L345 128 L395 121 L445 145 L495 128 L545 150 L580 135" fill="none" stroke="#23876d" stroke-width="3"/>${['11/01','11/05','11/10','11/15','11/20','11/25'].map((t,i)=>`<text x="${45+i*102}" y="210">${t}</text>`).join('')}</svg>`}
function bars(){return `<div style="height:230px;padding-top:20px">${[['微信小程序',54,'#27866e'],['平台电商',38.7,'#7daf9b'],['直播渠道',25.6,'#b1cfc1'],['其他渠道',10.3,'#d4e4db']].map(([t,w,c])=>`<div style="display:flex;align-items:center;gap:15px;margin:22px 0;font-size:12px"><span style="width:55px">${t}</span><div style="width:${w/54*64}%;height:17px;border-radius:3px;background:${c}"></div><span class="muted">${w.toFixed(1)}万</span></div>`).join('')}</div>`}
function charts(){return `<div class="chartgrid"><div class="card"><div class="row"><h3>销售额趋势</h3><span class="legend"><span class="dot"></span>本月　 ┄ 上月同期</span></div>${line()}</div><div class="card"><h3>渠道销售额分布</h3>${bars()}</div></div>`}
const warehouseSamples = [
  { warehouse: '一号仓', available: 6000, nearExpiry: 720, shortages: 2 },
  { warehouse: '二号仓', available: 5000, nearExpiry: 160, shortages: 1 }
];
const processingSamples = [
  { batch: 'JG-1125-01', warehouse: '一号仓', input: 1000, output: 960, waste: 40, received: 960 },
  { batch: 'JG-1125-02', warehouse: '二号仓', input: 800, output: 712, waste: 88, received: 680 }
];
const liveSamples = [
  { session: '直播 A · 11 月 25 日', paid: 18600, refund: 600 },
  { session: '直播 B · 11 月 25 日', paid: 14200, refund: 2200 },
  { session: '直播 C · 11 月 25 日', paid: 9400, refund: 400 }
];
const lossRate = row => row.waste / row.input * 100;
const reviewBatch = processingSamples.find(row => lossRate(row) > 6 && row.output !== row.received);
const formatNumber = value => value.toLocaleString('zh-CN');
const scopedWarehouseRows = rows => rows.filter(row => !current()?.warehouse || current().warehouse === row.warehouse);

function operationTable(headers, rows) {
  return `<div class="table-scroll"><table class="list"><thead><tr>${headers.map(header => `<th scope="col">${header}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(value => `<td>${value}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function warehouseChart() {
  return `<p class="muted">库存快照 · 11 月 25 日 10:20 · 临期指未来 3 天到期</p>${operationTable(
    ['仓库', '可用库存（件）', '临期可用库存（件）', '缺货 SKU'],
    scopedWarehouseRows(warehouseSamples).map(row => [row.warehouse, formatNumber(row.available), row.nearExpiry, row.shortages])
  )}`;
}

function processingChart() {
  return `<p class="muted">11 月 25 日已完工批次 · 重量单位为 kg · 复核线为 6%（示例）</p>${operationTable(
    ['批次', '仓库', '投料', '合格产出', '报损', '损耗率', 'WMS 已入库', '核对'],
    scopedWarehouseRows(processingSamples).map(row => [
      row.batch, row.warehouse, formatNumber(row.input), row.output, row.waste,
      lossRate(row) > 6 ? `<strong class="attention">${lossRate(row).toFixed(1)}%</strong>` : `${lossRate(row).toFixed(1)}%`,

// The sample deliberately includes a refund from an earlier order and a refund after the period.
const salesSample = {
  payments: [
    { id: 'A', date: '11-05', amount: 1000 },
    { id: 'B', date: '10-25', amount: 800 },
    { id: 'C', date: '11-25', amount: 600 }
  ],
  refunds: [
    { id: 'A', date: '11-20', amount: 120 },
    { id: 'B', date: '11-02', amount: 80 },
    { id: 'C', date: '11-26', amount: 50 }
  ]
};
const salesSampleExpected = { payment: 1430, refund: 1400 };

function calculateSalesSample(rule) {
  const inRange = date => date >= '11-01' && date <= '11-25';
  const payments = salesSample.payments.filter(payment => inRange(payment.date));
  const refunds = salesSample.refunds.filter(refund => rule === 'payment'
    ? payments.some(payment => payment.id === refund.id)
    : inRange(refund.date));
  const total = payments.reduce((sum, row) => sum + row.amount, 0) - refunds.reduce((sum, row) => sum + row.amount, 0);
  const expected = salesSampleExpected[rule];
  return { total, expected, passed: total === expected };
}

    <tbody>${salesSample.payments.map(payment => {
      const refund = salesSample.refunds.find(row => row.id === payment.id);
      return `<tr><td>${payment.id}</td><td>${payment.date} · ${payment.amount} 元</td><td>${refund.date} · ${refund.amount} 元</td></tr>`;
    }).join('')}</tbody></table></details>`;
}

function netSalesEditor(latest) {
  const next = latest.version + 1;
  const affected = dashboards.filter(board => board.cards.some(id => chartLibrary.some(chart => chart.id === id && chart.metricVersion)));
  const validation = salesDraft.validation;
  return `<section class="card section" id="net-sales-editor"><div class="row"><h2>净销售额草稿 <span class="tag">候选 v${next}</span></h2><button onclick="discardNetSales()">放弃草稿</button></div>
    <div class="chartgrid"><div>
      <form onsubmit="validateNetSales(event)">
        <label class="field">退款归属<select id="refund-rule" onchange="updateRefundRule(this.value)">
          ${Object.entries(refundRules).map(([id, rule]) => `<option value="${id}" ${id === salesDraft.rule ? 'selected' : ''}>${rule.label}</option>`).join('')}
        </select></label>
        <label class="field">修改原因<textarea id="change-reason" required rows="3" oninput="salesDraft.reason=this.value" placeholder="例如：退款应与财务月报的发生月份一致。">${esc(salesDraft.reason)}</textarea></label>
        <button>运行样例验证</button>
      </form>
      <p class="muted">验证基于内置样例与预期值。</p>
      ${sampleDetails()}
      ${validation ? `<p class="insight" role="status"><strong>${validation.passed ? '样例验证通过' : '样例验证失败'}</strong><br>实际 ${validation.total.toLocaleString('zh-CN')} 元，基准 ${validation.expected.toLocaleString('zh-CN')} 元。</p>` : ''}
    </div><div class="knowledge-review">
      <h3>口径差异</h3>
      <p><span class="muted">正式 v${latest.version}</span><br>${refundRules[latest.rule].label}</p>
      <p><span class="muted">候选 v${next}</span><br>${refundRules[salesDraft.rule].label}</p>
      <p class="muted">${latest.rule === salesDraft.rule ? '选择不同的退款归属规则后即可验证。' : refundRules[salesDraft.rule].description}</p>
      <h3>引用此指标的看板（${affected.length}）</h3>
      <ul>${affected.map(board => `<li>${esc(board.name)}${board.archived ? '（已归档）' : ''}</li>`).join('')}</ul>
      <p class="muted">发布后，外部工具默认读取 v${next}。已有图表继续使用绑定版本，迁移时需要单独确认。</p>
      <button class="primary" onclick="publishNetSales()" ${validation?.passed ? '' : 'disabled'}>发布 v${next}</button>
    </div></div></section>`;
}

function updateRefundRule(rule) {
  salesDraft.rule = rule;
  salesDraft.validation = null;
  render();
  $('#refund-rule').focus({ preventScroll: true });
}

function validateNetSales(event) {
  event.preventDefault();
  if (!salesDraft.reason.trim()) { toast('请填写修改原因'); return; }
  if (salesDraft.rule === latestNetSales().rule) { toast('请先选择不同的退款归属规则'); return; }
  salesDraft.validation = calculateSalesSample(salesDraft.rule);
  render();
  $('#net-sales-editor').scrollIntoView({ block: 'nearest' });
}

function publishNetSales() {
  if (!salesDraft.validation?.passed || !salesDraft.reason.trim()) {
    toast('请填写修改原因，并通过样例验证');
    return;
  }
  const version = latestNetSales().version + 1;
  netSalesHistory.push({
    version,
    rule: salesDraft.rule,
    reason: salesDraft.reason.trim(),
    validation: salesDraft.validation,
    author: '林晓',
    date: new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' })
  });
  salesDraft = null;
  openKnowledge('sales', '变更记录');
  toast(`净销售额 v${version} 已发布到演示会话`);
}

function discardNetSales() {
  modal('<h2>放弃口径草稿？</h2><p>草稿中的修改及验证结果将清除。</p><button onclick="closeModal()">继续编辑</button> <button onclick="salesDraft=null;closeModal();render()">放弃草稿</button>');
}
function sources(){return `<div class="row"><div><span class="eyebrow">CONNECTIONS</span><h1>连接业务中的每一份数据</h1><p class="muted">数据库与业务 API，统一成为可理解、可分析的数据。</p></div><button class="primary" onclick="connect()">＋ 添加数据源</button></div><div class="grid section">${[['PG','ERP 经营数据','PostgreSQL · 演示映射'],['MY','商城与小程序','MySQL · 演示映射'],['API','WMS 与平台接口','API · 演示映射']].map(([i,n,d])=>`<div class="card"><div class="sourceicon">${i}</div><div class="row"><h3>${n}</h3><span class="tag">● 正常</span></div><p class="muted">${d}</p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="row"><span class="muted">最近检测 10:30</span><button onclick="connect('${i==='PG'?'PostgreSQL':i==='MY'?'MySQL':'API'}')">配置 →</button></div></div>`).join('')}</div><div class="insight"><b>从连接到可分析，还差一步业务理解</b><br>接入后补充字段说明、指标口径和表关联，为查询与外部分析工具提供一致的业务口径。</div>${sourceReconciliation()}`}
function modal(s){$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}function closeModal(){$('#modal').innerHTML=''}
function connect(type='PostgreSQL'){modal(`<div class="row"><h2>配置数据源</h2><button onclick="closeModal()">×</button></div><label class="field">连接类型<select id="ctype" onchange="connect(this.value)">${['PostgreSQL','MySQL','API'].map(t=>`<option ${type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field">显示名称<input placeholder="例如：经营数据库"></label>${type==='API'?`<label class="field">API 模式<select><option>参数化查询 API</option><option>明细数据集 API</option></select></label><label class="field">接口 URL<input placeholder="https://internal.example/api/inventory"></label><label class="field">鉴权方式<select><option>Bearer Token</option><option>自定义 Header</option></select></label><label class="field">返回数据路径<input placeholder="data.items"></label><p class="muted">后续配置参数、字段含义、聚合限制和刷新策略。</p>`:`<label class="field">主机<input placeholder="db.internal.example"></label><div class="row"><label class="field">端口<input value="${type==='MySQL'?'3306':'5432'}"></label><label class="field">数据库<input placeholder="business"></label></div><label class="field">只读账号<input placeholder="analytics_reader"></label><label class="field">密码<input type="password" placeholder="输入连接密码"></label>`}<div class="row"><button onclick="$('#testresult').textContent='✓ 演示连接测试通过；未访问真实服务'">测试连接</button><button class="primary" onclick="closeModal();toast('接入配置已完成演示；未建立真实连接')">保存配置</button></div><p id="testresult" class="up"></p>`)}
let keys=[];
function integration(){return `<div class="row"><div><span class="eyebrow">EXTERNAL INTEGRATIONS</span><h1>MCP / Skill 接入</h1><p class="muted">在外部 AI 工具中分析数据，结果保存到 DataCube 的图表和看板。</p></div><button class="primary" onclick="keyDialog()">＋ 创建 API Key</button></div><div class="chartgrid section"><div class="card"><span class="tag">MCP</span><h2>连接外部 AI 客户端</h2><p>服务地址</p><pre>https://datacube.example.internal/mcp</pre><p class="muted">示例地址 · 将地址与 API Key 配置到支持 MCP 的客户端。</p><h3 class="section">可授权的能力</h3><p style="line-height:2">读取已发布的业务知识与指标版本 · 执行只读查询<br>创建图表 · 按 ID 更新看板 · 读取执行状态</p><button onclick="configDialog()">查看连接配置</button></div><div class="card"><span class="tag">SKILL</span><h2>通过 Skill 使用</h2><p style="line-height:1.9">Skill 指导外部 Agent 理解平台指标和调用流程，通过 MCP 或平台 API 执行操作。沿用同一 API Key 权限。</p><ol style="line-height:2.2"><li>安装企业提供的 DataCube Skill</li><li>配置平台地址与 API Key</li><li>在外部工具中查数或生成看板</li><li>回到平台查看与管理结果</li></ol><p class="muted">原型仅展示接入流程，尚未交付真实 MCP 服务或 Skill 安装包。</p></div></div><div class="card section"><h3>API Keys</h3><p class="muted">Key 绑定创建者、业务空间及授权范围。完整密钥仅在创建时展示一次。</p><table class="list"><tr><th>名称</th><th>标识</th><th>权限</th><th>到期时间</th><th>状态</th><th></th></tr>${keys.length?keys.map((k,i)=>`<tr><td>${esc(k.name)}</td><td>dc_demo_••••${i+1000}</td><td>${k.write?'查询、创建图表与看板':'只读查询'}</td><td>30 天后</td><td>${k.revoked?'已撤销':'有效'}</td><td><button ${k.revoked?'disabled':''} onclick="keys[${i}].revoked=true;render();toast('演示 Key 已撤销')">撤销</button></td></tr>`).join(''):'<tr><td colspan="6">暂无 API Key，创建后可配置到外部客户端。</td></tr>'}</table></div>`}
function keyDialog(){modal(`<div class="row"><h2>创建 API Key</h2><button onclick="closeModal()">×</button></div><label class="field">名称<input id="keyname" placeholder="例如：个人分析工具"></label><label class="field">业务空间<select><option>经营分析空间</option></select></label><label class="field">授权范围<select id="keyscope"><option value="read">只读查询</option><option value="write">查询 + 创建图表与看板</option></select></label><label class="field">有效期<select><option>30 天</option></select></label><p class="muted">权限不超过创建者已有权限，不能修改业务数据。</p><button class="primary" onclick="createKey()">创建</button>`)}
function createKey(){let name=$('#keyname').value.trim();if(!name){toast('请填写 Key 名称');return}keys.push({name,write:$('#keyscope').value==='write',revoked:false});render();modal(`<h2>API Key 已创建</h2><p>请复制并保存，关闭后不再展示完整内容。</p><pre id="newkey">dc_demo_not_a_real_secret_${keys.length}</pre><p class="muted">这是不可用于鉴权的演示字符串，请勿输入真实凭据。</p><button onclick="copyText($('#newkey').textContent)">复制演示 Key</button> <button class="primary" onclick="closeModal()">已保存，关闭</button>`)}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>toast('请手动选择文本复制'));else toast('请手动选择文本复制')}
function configDialog(){modal(`<h2>MCP 客户端连接配置</h2><pre>{
  "url": "https://datacube.example.internal/mcp",
  "headers": {
    "Authorization": "Bearer &lt;DATACUBE_API_KEY&gt;"
  }
}</pre><p class="muted">概念配置，实际字段名由客户端决定；API Key 是平台访问凭据，不是模型供应商密钥。</p><button onclick="closeModal()">关闭</button>`)}
function render(){$('#nav').innerHTML=names.map((n,i)=>`<button class="${page===i?'active':''}" onclick="${i===2?'openKnowledge()':'go('+i+')'}"><span class="navicon">${icons[i]}</span>${n}</button>`).join('');$('#crumb').textContent=page===1&&current()?'看板 / '+current().name:page===2&&knowledgeTopic?'业务知识 / '+knowledgeTopics[knowledgeTopic].name:names[page];$('#variantlabel').textContent=`原型 ${v} · ${{A:'资产导航优先',B:'经营概览优先',C:'团队资产优先'}[v]}`;$('#app').innerHTML=`<div class="banner">产品交互原型 · 虚拟数据 · 操作仅在当前会话生效</div>`+[home,dashboard,knowledge,sources,integration][page]()}if(dashboards.some(b=>b.id===initialBoard)){activeId=initialBoard;page=1}render();
</script></body></html>
