services:
  server:
    image: ${DATACUBE_SERVER_IMAGE:?部署脚本必须提供镜像名称}
    restart: unless-stopped
    ports:
      - '${DATACUBE_PORT:-3001}:3001'
    environment:
      # Serialize platform database operations for the single SQLite file.
      DATABASE_URL: file:/data/datacube.db?connection_limit=1
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-480}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-7}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@datacube.local}
      SEED_MEMBER_EMAIL: ${SEED_MEMBER_EMAIL:-member@datacube.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?请配置 SEED_ADMIN_PASSWORD}
      SEED_MEMBER_PASSWORD: ${SEED_MEMBER_PASSWORD:?请配置 SEED_MEMBER_PASSWORD}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
      CHART_DATA_CONNECTIONS: ${CHART_DATA_CONNECTIONS:-}
      CHART_DATA_SOURCES: ${CHART_DATA_SOURCES:-}
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          Promise.all([fetch('http://127.0.0.1:3001/api/health').then(async r =>
          r.ok && (await r.json()).database === 'up'),
          fetch('http://127.0.0.1:3001/').then(r => r.ok)])
          .then(results => process.exit(results.every(Boolean) ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
volumes:
  data:
